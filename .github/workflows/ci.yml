name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating major tag; Dependabot bumps it
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format check
        run: uv run poe lint

      - name: Type check
        run: uv run poe typecheck

      - name: Tests with coverage
        run: uv run poe test

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait until healthy
        run: |
          docker run --detach --name app --publish 8000:8000 app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy"
          docker logs app
          exit 1

      - name: Check the container runs as a non-root user
        run: test "$(docker exec app id -u)" != "0"
