[project]
name = "service-template"
version = "0.1.0"
description = "Template for Pit Wall Python services: uv, ruff, mypy strict, pytest, Docker and CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dawoodikram482" }]
keywords = ["python", "template", "uv", "fastapi", "ruff", "mypy", "docker", "github-actions"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
service-template = "service_template.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tasks: uv run poe <task>   (works the same on Windows, macOS and Linux)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
format = { sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }], help = "Fix lint issues and format the code" }
lint = { sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }], help = "Lint and check formatting" }
typecheck = { cmd = "mypy", help = "Type-check with mypy --strict" }
test = { cmd = "pytest", help = "Run tests with coverage (fails below 80%)" }
check = { sequence = ["lint", "typecheck", "test"], help = "Everything CI runs" }
run = { cmd = "python -m service_template", help = "Start the service" }
dev = { cmd = "uvicorn service_template.api.app:create_app --factory --reload", help = "Start with auto-reload" }
hooks = { cmd = "pre-commit install", help = "Install the git pre-commit hooks" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "N",        # naming
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "S",        # security (bandit)
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PT",       # pytest style
    "RET",      # return statements
    "ANN",      # type annotations
    "D",        # docstrings
    "RUF",      # ruff-specific
]
ignore = [
    "D100",     # module docstrings are optional
    "D104",     # package docstrings are optional
    "D105",     # magic-method docstrings are optional
    "D107",     # __init__ docstrings are optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN401"]

[tool.ruff.format]
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

# ---------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov", "--cov-report=term-missing"]
xfail_strict = true

[tool.coverage.run]
source = ["service_template"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
